<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TicTacToe</title>
    <meta
      name="description"
      content="TicTacToe game"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="slaythespire_styles.css"
    />
    <link
      rel="icon"
      href="data:,"
    />
    <script
      defer
      src="generated_js/hw6_slaythespire_ui.bc.js"
    ></script>
  </head>

  <body>
    <!-- Notification permission button -->
    <div
      id="notification-prompt"
      style="
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10000;
        background: #4caf50;
        color: white;
        padding: 15px;
        border-radius: 5px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        display: none;
      "
    >
      <p style="margin: 0 0 10px 0">
        Enable push notifications for game updates?
      </p>
      <button
        id="enable-notifications"
        style="
          background: white;
          color: #4caf50;
          border: none;
          padding: 8px 16px;
          border-radius: 3px;
          cursor: pointer;
          font-weight: bold;
        "
      >
        Enable Notifications
      </button>
      <button
        id="dismiss-notifications"
        style="
          background: transparent;
          color: white;
          border: 1px solid white;
          padding: 8px 16px;
          border-radius: 3px;
          cursor: pointer;
          margin-left: 8px;
        "
      >
        Maybe Later
      </button>
    </div>

    <div id="app"></div>

    <!-- Firebase SDKs - using CDN for namespace API compatibility -->
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.6.0/firebase-messaging-compat.js"></script>

    <!-- Firebase initialization -->
    <script>
      // Initialize Firebase after page load to avoid blocking Bonsai
      window.addEventListener("load", function () {
        const firebaseConfig = {
          apiKey: "AIzaSyAMNg5zUEAiwLU4TDTlLhGm3Pqp032se5Q",
          authDomain: "coop-slaythespire.firebaseapp.com",
          projectId: "coop-slaythespire",
          storageBucket: "coop-slaythespire.firebasestorage.app",
          messagingSenderId: "783879862672",
          appId: "1:783879862672:web:720391cc095eeed0f81b15",
          measurementId: "G-MYW8H985KZ",
        };

        try {
          // Initialize Firebase (compat library provides firebase namespace)
          firebase.initializeApp(firebaseConfig);
          const auth = firebase.auth();
          const firestore = firebase.firestore();
          const analytics = firebase.analytics();
          const messaging = firebase.messaging();

          // Keep the original firebase namespace intact (needed for GoogleAuthProvider)
          // and add helpers for OCaml to get the auth and firestore instances
          window.firebaseAuth = auth;
          window.firebaseFirestore = firestore;
          // firebase namespace remains available globally via the compat SDK

          if ("serviceWorker" in navigator) {
            navigator.serviceWorker
              .register("./firebase-messaging-sw.js")
              .then(function (registration) {
                console.log("Service worker registered:", registration);

                // Wait for service worker to be ready before getting token
                return navigator.serviceWorker.ready;
              })
              .then(function (registration) {
                console.log("Service worker is ready:", registration);

                // Check current notification permission
                checkNotificationPermission();
              })
              .catch(function (err) {
                console.error("Service worker registration failed:", err);
              });
          } else {
            console.log("Service workers are not supported in this browser.");
          }

          // Check if we need to show the notification prompt
          function checkNotificationPermission() {
            console.log(
              "Notification permission status:",
              Notification.permission
            );
            if (Notification.permission === "granted") {
              // Already granted, get token immediately
              console.log("Permission granted, getting token...");
              getTokenAndLog();
            } else if (Notification.permission === "default") {
              // Auto-request permission without showing custom button
              console.log("Permission not set, requesting...");
              askPermissionAndGetToken();
            } else {
              console.log("Notification permission denied");
            }
          }

          // Handle button clicks (attach listeners immediately since we're in window.load)
          const enableBtn = document.getElementById("enable-notifications");
          const dismissBtn = document.getElementById("dismiss-notifications");

          if (enableBtn) {
            enableBtn.addEventListener("click", function () {
              console.log("Enable button clicked");
              askPermissionAndGetToken();
            });
          }

          if (dismissBtn) {
            dismissBtn.addEventListener("click", function () {
              console.log("Dismiss button clicked");
              const promptDiv = document.getElementById("notification-prompt");
              if (promptDiv) {
                promptDiv.style.display = "none";
              }
            });
          }

          function askPermissionAndGetToken() {
            Notification.requestPermission().then(function (permission) {
              if (permission !== "granted") {
                console.log("Notification permission not granted:", permission);
                return;
              }

              // Hide the prompt
              document.getElementById("notification-prompt").style.display =
                "none";

              // Get token
              getTokenAndLog();
            });
          }

          function getTokenAndLog() {
            console.log("getTokenAndLog() called");

            // Replace with your VAPID public key
            const vapidKey =
              "BP75Vz4zkiRQfQ-EgLflsPRDjKSzpNl5My1-v3JgmrRGHyMK4mkcR1fBeK8cQj7EoDrxeIDFhifrP5oU47jprzw";

            console.log("Requesting FCM token with VAPID key...");

            // Use the already-registered service worker
            navigator.serviceWorker.ready.then(function (registration) {
              return messaging.getToken({
                vapidKey,
                serviceWorkerRegistration: registration,
              });
            }).then(function (currentToken) {
                if (currentToken) {
                  console.log("========================================");
                  console.log("✅ FCM TOKEN:");
                  console.log(currentToken);
                  console.log("========================================");
                  console.log(
                    "Copy the token above to send test notifications!"
                  );
                  // TODO: send this token to backend or copy it for testing
                } else {
                  console.log(
                    "No registration token available. Request permission to generate one."
                  );
                }
              })
              .catch(function (err) {
                console.error("❌ ERROR getting token:", err);
                console.error("Full error details:", err.message, err.code);
              });
          }

          // Handle messages when the page is in the foreground
          messaging.onMessage(function (payload) {
            console.log("Message received in foreground:", payload);

            // Extract notification data
            const notificationTitle =
              payload.notification?.title || "New Message";
            const notificationOptions = {
              body: payload.notification?.body || "You have a new notification",
              icon: payload.notification?.icon || "/assets/ironclad.png",
              badge: "/assets/ironclad.png",
              tag: "game-notification",
              requireInteraction: true, // Auto-dismiss after a few seconds
            };

            // Show browser notification even when page is open
            if (Notification.permission === "granted") {
              new Notification(notificationTitle, notificationOptions);
            }
          });
        } catch (error) {
          console.warn("Firebase initialization failed (non-critical):", error);
        }
      });
    </script>
  </body>
</html>
